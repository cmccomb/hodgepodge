title: Orthoptera Species File
alias: SF Orthoptera
description: |-
  The Orthoptera Species File is a taxonomic database of the world's Orthoptera
  (grasshoppers, locusts, katydids and crickets), both living and fossil. It has full
  synonymic and taxonomic information for more than 28,070 valid species, 45,850 scientific
  names, 213,200 citations to 14,200 references, 96,300 images, 1630 sound recordings,
  and 99,700 specimen records.
