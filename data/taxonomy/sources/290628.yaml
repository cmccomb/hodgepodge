title: Coleoptera type genera and family-group names
alias: Coleoptera type genera
description: "This dataset is based on the publication: Bouchard,P., Y. Bousquet,\
  \ A. Davis and C. Cai. 2024. On the nomenclatural status of type genera in Coleoptera\
  \ (Insecta). Zookeys 1194: 1-981. It includes more than 4,700 nominal family-group\
  \ names (including names for fossils and ichnotaxa) that are nomenclaturally available\
  \ in the order Coleoptera. Each family-group name includes the type genus. For each\
  \ type genus the authorship and year of publication are provided, along with its\
  \ current status (i.e., whether treated as accepted or synonym) and its current\
  \ classification. Some other non type-genus were included to complete the synonym\
  \ relationships. The list of nomenclaturally available family-group names is presented\
  \ in a classification scheme. \nThis dataset differs slightly from the published\
  \ article, as certain errors —pertaining to spelling, authorship, or hierarchical\
  \ relationships— were identified and subsequently corrected.\nThis version of the\
  \ dataset does not include the type species mentioned in the article nor does it\
  \ include the supporting references for each name."
