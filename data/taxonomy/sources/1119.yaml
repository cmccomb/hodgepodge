description: "The checklist includes a list of all currently known and accepted species\
  \ of freshwater hairworms (Nematomorpha), assembled in the Freshwater Animal Diversity\
  \ Assessment (FADA) project. Nematomorpha are parasites of terrestrial (in few cases\
  \ aquatic) insects. For sexual reproduction, they leave their host by driving it\
  \ into water and emerging there. Five species are marine, 356 species live in freshwater.\
  \ Horsehair worms are found in many different aquatic habitats throughout the world."
