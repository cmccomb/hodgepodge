description: |-
  Tortricid.net is pleased to offer the complete World Catalogue of the Tortricidae. This is a complete list of all world species, utilizing the World Catalogue published in 2005 as the foundation for the database. Version 4.0 of the online catalogue contains 15,634 records representing 11,365 species. More than 800 records have been updated from Version 3.0 (Dec, 2014), and more than 4,000 records have been updated from the original catalogue. The database is completely searchable and contains photos of over 1,200 type specimens.

  This catalogue will be updated regularly both with corrections from the original world catalogue and with additions since its publication. As such, these pages will serve as the most up to date information on current tortricid nomenclature. If you find any errors in the data presented here or have any questions/comments, please use the contact form to send the authors an email.

  We are indebted to all of the original authors of the World Catalogue (J. W. Brown, J. Baixeras, R. Brown, M. Horak, F. Komai, E. Metzler, J. Razowski, and K. Tuck) for providing the basis for this project. We would also like to thank the dozens of individuals who have provided corrections or updates to the database since it was first placed online in 2007.
