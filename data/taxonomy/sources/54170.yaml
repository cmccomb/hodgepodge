title: Robert E. Lewis World Species Flea (Siphonaptera) List
alias: LWS fleas
description: "The Robert E. Lewis World Species Flea (Siphonaptera) List was originally\
  \ a list of valid species compiled and maintained by the late Robert E. Lewis (16\
  \ th edition, 2009 was his last listing). During his tenure, he distributed these\
  \ extremely valuable informal, unpublished texts to a limited number of flea specialists\
  \ around the world. Following his death, the list was converted to an Excel file\
  \ with sorting capabilities. After the initial conversion of the LWS, Michael Hastriter\
  \ and Robert Bossard continued to maintain and record many changes in nomenclature,\
  \ synonyms, and newly described taxa. Currently there are 19 recognized Siphonapteran\
  \ families, 259 flea genera (252 extant and 7 fossils), 2,695 valid extant species\
  \ (including subspecies), and 17 fossil species. This is the most comprehensive\
  \ listing of valid Siphonapteran taxa. There are also 965 synonyms included. The\
  \ database provides classification designations for Infraorders, Superfamilies,\
  \ Families, Subfamilies, Tribes, Genera, Subgenera and Species. The LWS list will\
  \ be also published in Flea News on an annual basis."
