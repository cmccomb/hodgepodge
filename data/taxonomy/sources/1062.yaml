description: |-
  The Mantodea Species File is a taxonomic database of the world's
  praying mantids (Order Mantodea), both of fossil and living species. It has full
  synonymic and taxonomic information for over 2,400 valid species and provides many
  images of specimens deposited in museums worldwide, as well as pictures of living
  praying mantids in the wild and in captivity.
