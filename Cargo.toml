[package]
name = "hodgepodge"
version = "0.4.1"
authors = ["Chris McComb <ccmcc2012@gmail.com>"]
description = "Ready-made enum datasets and optional animal taxonomy for prototyping, teaching, and experimentation"
edition = "2021"
rust-version = "1.71"
readme = "README.md"
repository = "https://github.com/cmccomb/hodgepodge"
homepage = "https://github.com/cmccomb/hodgepodge"
documentation = "https://docs.rs/hodgepodge"
license = "(MIT OR Apache-2.0) AND CC-BY-4.0"
keywords = ["enum", "dataset", "prototype", "teaching", "education"]
# Import audit inputs remain in the Git source; runtime data and attribution stay bundled.
exclude = ["data/taxonomy/col-selection.tsv.gz", "data/taxonomy/wikidata.tsv.gz"]
categories = ["data-structures", "development-tools::testing", "rust-patterns", "science"]


[dependencies]
# Optional enum helpers for iterating and deriving utilities.
strum = { version = "0.27.2", optional = true }
strum_macros = { version = "0.27.2", optional = true }
# Optional serialization support for exporting the enum datasets.
serde = { version = "1.0", features = ["derive"], optional = true }
# Caller-supplied RNGs; no implicit system entropy or global generator.
rand = { version = "0.9.2", default-features = false, features = ["unbiased"], optional = true }

[dev-dependencies]
bincode = "1.3.3"
serde_json = "1.0"
rand_chacha = { version = "0.9", default-features = false }

[features]
# Keep the default feature set minimal so downstream users opt-in explicitly.
default = []
# Enables the optional `strum` integration which provides iterator helpers and
# variant counts.
strum = ["dep:strum", "dep:strum_macros"]
# Backwards compatibility shims for downstream crates that still enable the old
# granular feature names. They simply forward to `strum` now that the derives
# are controlled by the single feature flag.
enum-iter = ["strum"]
enum-count = ["strum"]
# Enables serde Serialize/Deserialize across the enum datasets.
serde = ["dep:serde"]
rand = ["dep:rand"]
# A bundled, attributed animal taxonomy; no runtime network or new dependencies.
taxonomy = []

[[example]]
name = "iter"
required-features = ["strum"]

[[example]]
name = "len"
required-features = ["strum"]

[[example]]
name = "palette"
required-features = ["strum"]

[[example]]
name = "fixtures"
required-features = ["serde"]

[package.metadata.docs.rs]
all-features = true
# The datasets are platform-independent; render the large taxonomy once.
targets = []

[[example]]
name = "dice_simulation"
required-features = ["rand"]

[[example]]
name = "deal_cards"
required-features = ["rand"]

[[example]]
name = "taxonomy_browser"
required-features = ["taxonomy"]
